<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <img src="image1.jpg" alt="Mountain">
<img src="image2.jpg" alt="Beach">
<img src="image3.jpg" alt="Forest">
<img src="image4.jpg" alt="Waterfall">
<img src="image5.jpg" alt="Sunset">
<img src="image6.jpg" alt="City">
<img src="image7.jpg" alt="Lake">
<img src="image8.jpg" alt="Road">
    </div>


    <!-- Lightbox -->

    <div class="lightbox" id="lightbox">

        <span class="close" id="close">&times;</span>

        <img id="lightboxImage" src="" alt="Large Image">

    </div>


    <script src="script.js"></script>

</body>

</html>
